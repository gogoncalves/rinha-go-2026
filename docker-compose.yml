services:
  api1:
    image: gugagoncalves/rinha-2026-go:v11
    platform: linux/amd64
    cpuset: "0"
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
      rtprio: 99
    environment:
      CTRL_SOCK_PATH: /sock/api1.sock
      MLOCK: "1"
      GOMAXPROCS: "1"
      GOGC: "500"
      GOMEMLIMIT: "140MiB"
    volumes:
      - sock:/sock
    network_mode: "none"
    deploy:
      resources:
        limits:
          cpus: "0.49"
          memory: "165MB"

  api2:
    image: gugagoncalves/rinha-2026-go:v11
    platform: linux/amd64
    cpuset: "1"
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
      rtprio: 99
    environment:
      CTRL_SOCK_PATH: /sock/api2.sock
      MLOCK: "1"
      GOMAXPROCS: "1"
      GOGC: "500"
      GOMEMLIMIT: "140MiB"
    volumes:
      - sock:/sock
    network_mode: "none"
    deploy:
      resources:
        limits:
          cpus: "0.49"
          memory: "165MB"

  lb:
    image: gugagoncalves/rinha-2026-go:v11
    platform: linux/amd64
    cpuset: "2,3"
    entrypoint: ["/lb"]
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      LB_PORT: "9999"
      LB_BACKLOG: "65535"
      LB_ACCEPT_BATCH: "128"
      API_SOCKETS: "/sock/api1.sock,/sock/api2.sock"
      GOMAXPROCS: "2"
    volumes:
      - sock:/sock
    depends_on: [api1, api2]
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.02"
          memory: "20MB"

volumes:
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=0,gid=0,mode=0777"

networks:
  rinha:
    driver: bridge
